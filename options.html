<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Mode Redirect – Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 36px 40px;
      max-width: 520px;
      width: 100%;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #1a1a2e;
    }

    .subtitle {
      font-size: .875rem;
      color: #6b7280;
      margin-bottom: 32px;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-label {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .radio-option:hover {
      border-color: #a78bfa;
      background: #faf5ff;
    }

    .radio-option input[type="radio"] {
      accent-color: #7c3aed;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .radio-option input[type="radio"]:checked + .option-text .option-title {
      color: #7c3aed;
    }

    .radio-option:has(input:checked) {
      border-color: #7c3aed;
      background: #f5f3ff;
    }

    .option-title {
      font-weight: 600;
      font-size: .9rem;
    }

    .option-desc {
      font-size: .78rem;
      color: #6b7280;
      margin-top: 2px;
    }

    .divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 28px 0;
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button {
      padding: 10px 24px;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity .15s, background .15s;
    }

    button:hover { opacity: .88; }

    #save-btn {
      background: #7c3aed;
      color: #fff;
    }

    #status {
      font-size: .85rem;
      color: #059669;
      font-weight: 600;
      opacity: 0;
      transition: opacity .3s;
    }

    #status.visible { opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>AI Mode Redirect</h1>
    <p class="subtitle">Configure which search engine and AI mode provider to use.</p>

    <!-- Search Engine -->
    <div class="section">
      <div class="section-label">Search Engine</div>
      <div class="radio-group" id="search-engine-group">

        <label class="radio-option">
          <input type="radio" name="searchEngine" value="brave" />
          <div class="option-text">
            <div class="option-title">Brave Search</div>
            <div class="option-desc">search.brave.com — queries detected on Brave Search results pages</div>
          </div>
        </label>

        <label class="radio-option">
          <input type="radio" name="searchEngine" value="google" />
          <div class="option-text">
            <div class="option-title">Google Search</div>
            <div class="option-desc">google.com/search — queries detected on Google Search results pages</div>
          </div>
        </label>

      </div>
    </div>

    <hr class="divider" />

    <!-- AI Mode Provider -->
    <div class="section">
      <div class="section-label">AI Mode Provider</div>
      <div class="radio-group" id="ai-mode-group">

        <label class="radio-option">
          <input type="radio" name="aiMode" value="brave" />
          <div class="option-text">
            <div class="option-title">Brave AI Mode</div>
            <div class="option-desc">search.brave.com/ask?q=…</div>
          </div>
        </label>

        <label class="radio-option">
          <input type="radio" name="aiMode" value="google" />
          <div class="option-text">
            <div class="option-title">Google AI Mode</div>
            <div class="option-desc">google.com/search?q=…&udm=50</div>
          </div>
        </label>

      </div>
    </div>

    <div class="btn-row">
      <button id="save-btn">Save Settings</button>
      <span id="status">✓ Saved!</span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
